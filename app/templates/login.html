<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Cloud Dropbox</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="auth-body">
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-brand">
                <div class="brand-icon"><i class="ri-folder-cloud-line"></i></div>
                <h1>Cloud Dropbox</h1>
                <p>Sign in to access your files</p>
            </div>

            <div class="form-group">
                <label for="login-email">Email</label>
                <input type="email" id="login-email" placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" placeholder="Enter your password">
            </div>

            <button id="login-btn" class="primary-btn full-btn">
                <i class="ri-login-box-line"></i>
                Login
            </button>

            <p class="auth-switch">
                Don’t have an account?
                <a href="/signup">Create one</a>
            </p>

            <div id="auth-message" class="auth-message"></div>
        </div>
    </div>

    <script type="module" src="/static/js/login.js"></script>
</body>
</html>
