<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Cloud Dropbox</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="auth-body">
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-brand">
                <div class="brand-icon"><i class="ri-folder-cloud-line"></i></div>
                <h1>Create Account</h1>
                <p>Start using your cloud storage</p>
            </div>

            <div class="form-group">
                <label for="signup-email">Email</label>
                <input type="email" id="signup-email" placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label for="signup-password">Password</label>
                <input type="password" id="signup-password" placeholder="Create a password">
            </div>

            <button id="signup-btn" class="primary-btn full-btn">
                <i class="ri-user-add-line"></i>
                Sign Up
            </button>

            <p class="auth-switch">
                Already have an account?
                <a href="/login">Login</a>
            </p>

            <div id="auth-message" class="auth-message"></div>
        </div>
    </div>

    <script type="module" src="/static/js/signup.js"></script>
</body>
</html>
